version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mindbridge_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mindbridge
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: mindbridge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 初始化容器：自动建表、导入知识库、创建测试用户，完成后退出
  init:
    build: .
    container_name: mindbridge_init
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://root:root@mysql:3306/mindbridge?charset=utf8mb4
      REDIS_URL: redis://redis:6379/1
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo '=== 初始化数据库表 ===' &&
        python -m scripts.init_db &&
        echo '=== 导入知识库 ===' &&
        python -m scripts.ingest_knowledge &&
        echo '=== 创建测试用户 ===' &&
        python -m scripts.create_test_user &&
        echo '=== 初始化完成 ==='
      "
    volumes:
      - chroma_data:/app/data/chroma_db

  app:
    build: .
    container_name: mindbridge_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://root:root@mysql:3306/mindbridge?charset=utf8mb4
      REDIS_URL: redis://redis:6379/1
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chroma_data:/app/data/chroma_db

volumes:
  mysql_data:
  redis_data:
  chroma_data:
